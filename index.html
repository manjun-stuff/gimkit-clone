<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gimkit Clone</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* The viewport completely expands to match any monitor or browser size */
        canvas {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            display: block;
        }
    </style>
</head>

<body>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type='text/javascript'>
        var Module = {
            requestPointerLock: function () { },
            canvas: (function () {
                return document.getElementById('canvas');
            })()
        };
    </script>
    <script async type="text/javascript" src="index.js"></script>
</body>

</html>
